name: it_startup_web
description: "Cinematic, high-end restaurant and food delivery web application."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  http: ^1.2.0
  lottie: ^3.1.2
  video_player: ^2.9.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - hero/
    - assets/
    - assets/videos/
    - assets/videos/hero/
    - assets/lottie/
